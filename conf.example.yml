# Структурные правила сервиса. Путь задаётся env RULES_PATH (по умолчанию ./conf.yml).
# Отсутствие файла — не ошибка: применяются значения ниже.

indexer:
  exclude_namespaces: [kube-system, kube-public, kube-node-lease]
  # workload, не видевшийся дольше этого срока, удаляется из каталога
  stale_after: 1h

# «имя образа → репозиторий GitHub», правила применяются по порядку, первое совпадение.
# Образ, не подошедший ни под одно правило, считается сторонним (postgres, redis…):
# его workload попадает в каталог без репозитория.
# Плейсхолдеры: {repo} — первые два сегмента пути (mechta-market/promo-sync; у ghcr образы
# лежат внутри репозитория: rendau/loom/server → rendau/loom), {path} — путь без registry целиком,
# {org} — первый сегмент пути (или поле org), {image_name} — последний сегмент.
# Правила проверяются по порядку; path — маска пути образа (path.Match) для исключений,
# когда имя образа не совпадает с репозиторием.
image_mapping:
  # ruto: одна репа собирает ruto-core и ruto-gateway
  - registry: ghcr.io
    path: "rendau/ruto-*"
    repo_template: "https://github.com/rendau/ruto"
  - registry: ghcr.io
    repo_template: "https://github.com/{repo}"

snapshot:
  # общий дедлайн параллельного сбора из источников
  deadline: 5s
  # отклонение от вчера (в %), после которого метрика помечается anomaly
  anomaly_threshold_pct: 30
  max_events: 50
  max_alerts: 50
  # golden signals, когда в service.yaml нет metrics. Плейсхолдеры: {namespace}, {pod_regex}, {service}.
  # Без секции берётся встроенный набор (rps, error_rate, latency_p95, cpu_cores, memory_bytes,
  # restarts_1h): метрики go-шаблона ищутся по имени регэкспом, т.к. в кластере они с префиксом
  # (mechta_caravan_request_total, у старых сервисов *_request_count) и статусом ok|error.
  # default_metrics:
  #   - id: rps
  #     title: Запросов в секунду
  #     promql: 'sum(rate({__name__=~".+_request_(total|count)", namespace="{namespace}", pod=~"{pod_regex}"}[5m]))'
  #     unit: rps
  # внешние метрики через gateway ruto — для сервисов с приложениями ruto; плейсхолдер {ruto_apps}.
  # Без секции — public_rps, public_error_rate, public_latency_p95 по метрикам из секции ruto.
  # public_metrics:
  #   - id: public_rps
  #     title: Запросов в секунду через gateway
  #     promql: 'sum(rate(mechta_ruto_gw_http_requests_total{app=~"{ruto_apps}"}[5m]))'
  #     unit: rps

logs:
  # сколько строк забирать из Loki за запрос и потолок окна (ограничение объёма выдачи)
  max_lines: 5000
  max_window: 24h
  # top-N паттернов в query_logs и число error-паттернов в снапшоте
  max_patterns: 20
  top_errors: 3
  # потолок строк в режиме raw
  raw_limit: 100
  # LogQL-селектор, когда в service.yaml нет logs.selector.
  # Плейсхолдеры: {namespace}, {pod_regex}, {service}, {workloads}
  # (логи в Loki шлёт fluent-bit: лейблы kubernetes_namespace_name, kubernetes_pod_name)
  default_selector: '{kubernetes_namespace_name="{namespace}", kubernetes_pod_name=~"{pod_regex}"}'

timeline:
  # общий дедлайн сбора изменений; потолок событий в ответе; коммитов на репозиторий за окно
  deadline: 8s
  # 100 событий ≈ 40 КБ: больше не влезает в лимит вывода MCP-клиентов (Claude Code ~25k токенов)
  max_events: 100
  commits_limit: 100
  # выше этого числа сервисов в запросе коммиты не собираются (запрос на репозиторий)
  max_services_for_commits: 10

dependencies:
  # потолок узлов графа в ответе get_dependencies и максимальная глубина обхода
  max_nodes: 50
  max_depth: 3

ruto:
  # сервис каталога gateway (имя образа ruto-gateway): источник рёбер «gateway → backend приложения»
  gateway_service: ruto-gateway
  # метрики gateway с лейблами app, method, status (префикс — METRICS_NAMESPACE ruto)
  requests_metric: mechta_ruto_gw_http_requests_total
  duration_metric: mechta_ruto_gw_http_request_duration_seconds
  # get_public_api: дедлайн и потолок маршрутов в ответе
  deadline: 8s
  max_endpoints: 100

endpoints:
  # жёсткие потолки для call_service_endpoint поверх декларации в service.yaml
  max_rows: 100
  max_body_bytes: 262144
  max_timeout: 10s
  # порт ручки, если в декларации не задан (HTTP-порт сервиса в кластере)
  default_port: 80

cluster:
  # get_cluster_health: дедлайн сбора, пороги деградации (pending-поды, поды в проблемных
  # состояниях: CrashLoopBackOff, ImagePullBackOff, OOMKilled, Restarting), усечение списков
  deadline: 8s
  pending_pods_threshold: 5
  problem_pods_threshold: 3
  max_problem_pods: 50
  max_event_reasons: 15
  max_infra_alerts: 30
  # метрики кластера с базовой линией; без секции — встроенный набор по node-exporter и
  # kube-state-metrics (cluster_cpu_usage_ratio, cluster_memory_usage_ratio, pods_not_ready,
  # container_restarts_1h)
  # metrics:
  #   - id: cluster_cpu_usage_ratio
  #     title: Загрузка CPU кластера
  #     promql: '1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))'
  #     unit: ratio
  #     direction: lower_is_better

metrics:
  # ограничения произвольного PromQL в query_metrics
  max_window: 168h
  max_series: 20
  max_points: 200
